<!DOCTYPE html>
<html>
<head>
    <title>Product Detail</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background: linear-gradient(to right, #fbc2eb, #a6c1ee); font-family: Arial;">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">🎨 Handmade Store</span>
        </div>
    </nav>

    <!-- Product Detail -->
    <div class="container mt-5">

        <div class="row">

            <!-- Image Section -->
            <div class="col-md-6 text-center">
                <div class="col-md-8 text-center">
    <img src="{{ url_for('static', filename=product.image.replace('static/', '')) }}" class="img-fluid rounded shadow" alt="{{ product.name }}">
</div>
            </div>

            <!-- Details Section -->
            <div class="col-md-6">

                <div class="card p-4 shadow">

                    <h2>{{ product.name }}</h2>

                    <h4 class="text-success">₹ {{ product.price }}</h4>

                    <p class="mt-3">{{ product.description }}</p>

                    <!-- Buttons -->
                    <div class="mt-4">

                        <a href="/add_to_cart/{{ product.id }}" class="btn btn-success me-2">
                            🛒 Add to Cart
                        </a>

                        <a href="/products" class="btn btn-secondary">
                            ← Back
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>
</body>
</html>
