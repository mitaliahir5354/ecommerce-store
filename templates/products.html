<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background: linear-gradient(to right, #a1c4fd, #c2e9fb);">

<div class="container mt-4">

<h2 class="text-center">Products</h2>

<a href="/add_product" class="btn btn-primary mb-3">Add Product</a>


<div class="row">
{% for p in products %}
<div class="col-md-4">
    <div class="card mb-4 shadow">
        <img src="/{{ p.image }}" height="200">
        <div class="card-body">
            <h5>{{ p.name }}</h5>
            <p>₹{{ p.price }}</p>
            <a href="/product/{{ p.id }}" class="btn btn-success">View</a>
            <a href="/delete_product/{{ p.id }}" 
   class="btn btn-danger btn-sm mt-2"
   onclick="return confirm('Are you sure you want to delete this product?')">
   🗑️ Delete
</a>
        </div>
    </div>
</div>
{% endfor %}

</div>


<div align="right">
<span align = "right">
    <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
</span>
</div>
</div>
</body>
</html>
