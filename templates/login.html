<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background: linear-gradient(to right, #fbc2eb, #a6c1ee); font-family: Arial;">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">🎨 Handmade Store</span>
        </div>
    </nav>

    <!-- Login Card -->
    <div class="container d-flex justify-content-center align-items-center" style="height:80vh;">

        <div class="card p-4 shadow" style="width:350px; border-radius:15px;">

            <h3 class="text-center mb-3">Login</h3>

            {% if error %}
            <p style="color:red;" class="text-center">{{ error }}</p>
            {% endif %}

            <form method="POST">

                <input type="email" name="email" class="form-control mb-3" placeholder="Email" required>

                <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>

                <button class="btn btn-success w-100">Login</button>

            </form>

            <p class="text-center mt-3">
                Don't have an account? 
                <a href="/register">Register Here</a>
            </p>

        </div>

    </div>

</body>
</html>
