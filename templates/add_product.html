<!DOCTYPE html>
<html>
<head>
    <title>Add Product</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background: linear-gradient(to right, #fbc2eb, #a6c1ee); font-family: Arial;">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">🎨 Handmade Store</span>
        </div>
    </nav>

    <!-- Add Product Card -->
    <div class="container d-flex justify-content-center align-items-center" style="height:85vh;">

        <div class="card p-4 shadow" style="width:400px; border-radius:15px;">

            <h3 class="text-center mb-3">Add New Product</h3>

            <form method="POST">

                <input type="text" name="name" class="form-control mb-3" placeholder="Product Name" required>

                <textarea name="description" class="form-control mb-3" placeholder="Description" rows="3" required></textarea>

                <input type="number" name="price" class="form-control mb-3" placeholder="Price (₹)" required>

                <input type="text" name="image" class="form-control mb-3" 
                       placeholder="Image path (e.g. static/images/p1.jpg)" required>

                <button class="btn btn-success w-100">Add Product</button>

            </form>

            <p class="text-center mt-3">
                <a href="/products">← Back to Products</a>
            </p>

        </div>

    </div>

</body>
</html>
